<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vokabel-Held — 20 Design-Ideen</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:#0e0e12;-webkit-font-smoothing:antialiased}
.wrap{max-width:440px;margin:0 auto;padding:14px 14px 40px}
.intro{color:#9a9aa6;font-size:.85rem;text-align:center;margin:8px 0 14px;line-height:1.5}
.intro b{color:#e8e8f0}
.themetabs{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:10px;position:sticky;top:0;background:#0e0e12;z-index:5}
.themetab{flex:0 0 auto;border:1.5px solid #2a2a34;background:#17171e;color:#b8b8c6;border-radius:999px;padding:7px 13px;font-weight:700;font-size:.78rem;cursor:pointer;white-space:nowrap}
.themetab.on{background:#fff;color:#111;border-color:#fff}
.phone{display:none;border-radius:28px;overflow:hidden;margin-bottom:26px;border:1px solid #26262f}
.phone.on{display:block}
.screen{padding:18px 16px 22px;min-height:640px;position:relative;overflow:hidden}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.logo .lt{font-size:1.4rem;font-weight:900;letter-spacing:-.02em}
.sub{font-size:.8rem;margin-bottom:16px}
.stats{display:flex;gap:10px;margin-bottom:12px}
.stat{flex:1;padding:12px;text-align:center;border-radius:18px}
.stat .n{font-size:1.4rem;font-weight:900}
.stat .l{font-size:.64rem;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.stat .si{margin-bottom:4px}
.cta{width:100%;border:none;border-radius:18px;padding:16px;font-size:1.02rem;font-weight:800;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.cta2{width:100%;border-radius:18px;padding:13px;font-size:.93rem;font-weight:700;cursor:pointer;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px}
.seclab{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;opacity:.5;margin:18px 0 8px;font-weight:800}
.brow{display:flex;gap:12px;align-items:center;padding:12px;margin-bottom:8px;border-radius:18px}
.bico{width:46px;height:58px;border-radius:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.bt{flex:1;min-width:0}
.bn{font-weight:800;font-size:.93rem}
.bs{font-size:.72rem;margin-top:2px;opacity:.65}
.pill{border-radius:999px;font-size:.72rem;font-weight:800;padding:4px 10px}
.mockcard{border-radius:22px;padding:26px 18px;text-align:center;margin:14px 0 10px;position:relative}
.mockword{font-size:2rem;font-weight:800;letter-spacing:-.02em}
.mockhint{font-size:.75rem;opacity:.55;margin-top:6px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.qbtn{min-height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.93rem;cursor:pointer;padding:8px;text-align:center}
.qbtn.good{outline:3px solid #22c55e}
.deco{position:absolute;pointer-events:none}
/* ===== 10 · Game Boy ===== */
.t-gb{background:#9bbc0f;color:#0f3800;font-family:"Courier New",monospace}
.t-gb .lt{color:#0f3800;text-transform:uppercase;letter-spacing:.1em}
.t-gb .sub{color:#306230}
.t-gb .stat{background:#8bac0f;border:3px solid #0f3800;border-radius:0}
.t-gb .stat .n{color:#0f3800}
.t-gb .stat .l{color:#306230}
.t-gb .cta{background:#0f3800;border-radius:0;color:#9bbc0f;text-transform:uppercase;letter-spacing:.08em}
.t-gb .cta2{background:#8bac0f;border:3px solid #0f3800;color:#0f3800;border-radius:0;text-transform:uppercase}
.t-gb .brow{background:#8bac0f;border:3px solid #0f3800;border-radius:0}
.t-gb .bico{background:#9bbc0f;border:2px solid #0f3800;border-radius:0}
.t-gb .pill{background:#0f3800;color:#9bbc0f;border-radius:0}
.t-gb .mockcard{background:#8bac0f;border:3px solid #0f3800;border-radius:0}
.t-gb .mockword{color:#0f3800}
.t-gb .qbtn{background:#8bac0f;border:3px solid #0f3800;color:#0f3800;border-radius:0}
/* ===== 11 · Mosaic ===== */
.t-mos{background:#f4ead8;color:#3a2f23}
.t-mos .lt{font-family:Georgia,serif;letter-spacing:.14em;text-transform:uppercase;color:#8a4b2a}
.t-mos .sub{color:#9b8468}
.t-mos .stat{background:linear-gradient(135deg,#e8d5b5 25%,#f0e2c8 25%,#f0e2c8 50%,#e8d5b5 50%,#e8d5b5 75%,#f0e2c8 75%);background-size:16px 16px;border:2px solid #b98a5e}
.t-mos .stat .n{color:#8a4b2a;font-family:Georgia,serif}
.t-mos .stat .l{color:#9b8468}
.t-mos .cta{background:#8a4b2a;border-radius:6px;box-shadow:0 4px 0 #5e3018}
.t-mos .cta2{background:#e8d5b5;border:2px solid #b98a5e;color:#8a4b2a;border-radius:6px}
.t-mos .brow{background:#efe3cc;border:2px solid #c9a377;border-radius:6px}
.t-mos .bico{background:#e2cba6;border:2px solid #b98a5e}
.t-mos .pill{background:#c96f3a;color:#fff}
.t-mos .mockcard{background:#f8f0e0;border:2px solid #b98a5e;border-radius:8px}
.t-mos .mockword{font-family:Georgia,serif;color:#8a4b2a}
.t-mos .qbtn{background:#efe3cc;border:2px solid #c9a377;color:#3a2f23;border-radius:6px}
/* ===== 12 · Dark Academia ===== */
.t-da{background:#211c16;color:#e8ddc8}
.t-da .lt{font-family:Georgia,serif;color:#d4af37;font-weight:700}
.t-da .sub{color:#9a8b6e}
.t-da .stat{background:#2a241b;border:1px solid #4a3f2e}
.t-da .stat .n{color:#d4af37;font-family:Georgia,serif}
.t-da .stat .l{color:#9a8b6e}
.t-da .cta{background:linear-gradient(135deg,#8b6f2f,#6b5422);border:1px solid #d4af37;box-shadow:0 8px 24px rgba(212,175,55,.2)}
.t-da .cta2{background:#2a241b;border:1px solid #4a3f2e;color:#d4af37}
.t-da .brow{background:#2a241b;border:1px solid #4a3f2e}
.t-da .bico{background:linear-gradient(160deg,#3a3122,#241e14)}
.t-da .pill{background:rgba(212,175,55,.15);color:#d4af37}
.t-da .mockcard{background:#2a241b;border:1px solid #4a3f2e}
.t-da .mockword{font-family:Georgia,serif;color:#e8ddc8}
.t-da .qbtn{background:#2a241b;border:1px solid #4a3f2e;color:#e8ddc8}
/* ===== 13 · Synthwave ===== */
.t-sw{background:linear-gradient(180deg,#2b0a4e 0%,#5c1a7a 45%,#ff6b9d 100%);color:#fff}
.t-sw .lt{color:#0ff;text-shadow:0 0 12px #0ff,0 0 30px #0ff88}
.t-sw .sub{color:#ffd6e8}
.t-sw .stat{background:rgba(0,0,0,.35);border:1px solid #ff2d95;box-shadow:0 0 12px rgba(255,45,149,.4)}
.t-sw .stat .n{color:#0ff;text-shadow:0 0 10px #0ff}
.t-sw .stat .l{color:#ffd6e8}
.t-sw .cta{background:linear-gradient(90deg,#ff2d95,#ff6b35);box-shadow:0 0 24px rgba(255,45,149,.6);border-radius:8px;text-transform:uppercase;letter-spacing:.08em}
.t-sw .cta2{background:rgba(0,255,255,.1);border:1px solid #0ff;color:#aff;text-shadow:0 0 8px #0ff;border-radius:8px}
.t-sw .brow{background:rgba(0,0,0,.35);border:1px solid #ff2d9588}
.t-sw .bico{background:linear-gradient(160deg,#3d1266,#1f0838)}
.t-sw .pill{background:#ff2d95;color:#fff;box-shadow:0 0 10px #ff2d95}
.t-sw .mockcard{background:rgba(0,0,0,.35);border:1px solid #0ff88}
.t-sw .mockword{color:#0ff;text-shadow:0 0 14px #0ff}
.t-sw .qbtn{background:rgba(0,0,0,.35);border:1px solid #ff2d9588;color:#ffe}
/* ===== 14 · Neo-Brutalism ===== */
.t-brut{background:#fdfd76;color:#000}
.t-brut .lt{text-transform:uppercase;letter-spacing:-.02em}
.t-brut .sub{color:#333}
.t-brut .stat{background:#fff;border:3px solid #000;box-shadow:5px 5px 0 #000;border-radius:0}
.t-brut .stat .n{color:#ff3b30}
.t-brut .stat .l{color:#333}
.t-brut .cta{background:#ff3b30;border:3px solid #000;box-shadow:6px 6px 0 #000;border-radius:0;text-transform:uppercase}
.t-brut .cta2{background:#4dd2ff;border:3px solid #000;box-shadow:5px 5px 0 #000;color:#000;border-radius:0}
.t-brut .brow{background:#fff;border:3px solid #000;box-shadow:5px 5px 0 #000;border-radius:0}
.t-brut .bico{background:#c3f584;border:2px solid #000;border-radius:0}
.t-brut .pill{background:#000;color:#fdfd76;border-radius:0}
.t-brut .mockcard{background:#fff;border:3px solid #000;box-shadow:8px 8px 0 #4dd2ff;border-radius:0}
.t-brut .mockword{color:#000}
.t-brut .qbtn{background:#fff;border:3px solid #000;box-shadow:4px 4px 0 #000;color:#000;border-radius:0}
/* ===== 15 · Risograph ===== */
.t-riso{background:#f7f3ec;color:#1f2a44}
.t-riso .lt{color:#e8483f;letter-spacing:-.03em}
.t-riso .sub{color:#6b7a99}
.t-riso .stat{background:#eef4ff;border:2px solid #2f5fd0;mix-blend-mode:multiply;border-radius:14px}
.t-riso .stat .n{color:#2f5fd0}
.t-riso .stat .l{color:#6b7a99}
.t-riso .cta{background:#e8483f;border-radius:14px;box-shadow:4px 4px 0 #2f5fd0}
.t-riso .cta2{background:#fff;border:2px solid #e8483f;color:#e8483f;border-radius:14px}
.t-riso .brow{background:#fff;border:2px solid #2f5fd0;border-radius:14px}
.t-riso .bico{background:#ffe8e6;border:2px solid #e8483f}
.t-riso .pill{background:#2f5fd0;color:#fff}
.t-riso .mockcard{background:#fff;border:2px solid #e8483f;border-radius:16px}
.t-riso .mockword{color:#e8483f}
.t-riso .qbtn{background:#eef4ff;border:2px solid #2f5fd0;color:#1f2a44;border-radius:14px}
/* ===== 16 · Bauhaus ===== */
.t-bau{background:#f2ede4;color:#1a1a1a}
.t-bau .lt{font-weight:900;text-transform:uppercase;letter-spacing:.05em}
.t-bau .sub{color:#7a7466}
.t-bau .stat{background:#fff;border-radius:0;border-top:6px solid #d40100}
.t-bau .stat:nth-child(2){border-top-color:#f2b90a}
.t-bau .stat:nth-child(3){border-top-color:#004be8}
.t-bau .stat .n{color:#1a1a1a}
.t-bau .stat .l{color:#7a7466}
.t-bau .cta{background:#d40100;border-radius:0;text-transform:uppercase;letter-spacing:.06em}
.t-bau .cta2{background:#004be8;border-radius:0;color:#fff}
.t-bau .brow{background:#fff;border-radius:0;border-left:8px solid #f2b90a}
.t-bau .brow:nth-child(odd){border-left-color:#004be8}
.t-bau .bico{background:#f2ede4;border-radius:50% 0 50% 0}
.t-bau .pill{background:#1a1a1a;color:#f2b90a;border-radius:0}
.t-bau .mockcard{background:#fff;border-radius:0;border:2px solid #1a1a1a}
.t-bau .mockword{color:#d40100}
.t-bau .qbtn{background:#fff;border:2px solid #1a1a1a;color:#1a1a1a;border-radius:0}
/* ===== 17 · Terminal ===== */
.t-term{background:#050807;color:#33ff66;font-family:ui-monospace,Menlo,Consolas,monospace}
.t-term .lt{color:#33ff66;text-shadow:0 0 10px #33ff6688}
.t-term .sub{color:#1f9e46}
.t-term .stat{background:#07120b;border:1px solid #1f9e46;border-radius:0}
.t-term .stat .n{color:#66ff8a}
.t-term .stat .l{color:#1f9e46}
.t-term .cta{background:#33ff66;color:#04140a;border-radius:0;text-transform:uppercase;letter-spacing:.1em;box-shadow:0 0 18px #33ff6655}
.t-term .cta2{background:transparent;border:1px solid #33ff66;color:#33ff66;border-radius:0}
.t-term .brow{background:#07120b;border:1px solid #1f9e46;border-radius:0}
.t-term .bico{background:#0a1a10;border:1px solid #33ff66}
.t-term .pill{background:#33ff66;color:#04140a;border-radius:0}
.t-term .mockcard{background:#07120b;border:1px solid #1f9e46;border-radius:0}
.t-term .mockword{color:#66ff8a;text-shadow:0 0 12px #33ff6666}
.t-term .qbtn{background:#07120b;border:1px solid #1f9e46;color:#8fffb0;border-radius:0}
/* ===== 18 · Aquarell ===== */
.t-aq{background:#fbf9f4;color:#33383f}
.t-aq .lt{font-family:Georgia,serif;color:#4a6fa5;font-weight:700}
.t-aq .sub{color:#98a2ad}
.t-aq .stat{background:rgba(120,160,210,.12);border-radius:22px 8px 22px 8px}
.t-aq .stat .n{color:#4a6fa5;font-family:Georgia,serif}
.t-aq .stat .l{color:#98a2ad}
.t-aq .cta{background:linear-gradient(120deg,#7ba3d4,#4a6fa5);border-radius:24px 8px 24px 8px}
.t-aq .cta2{background:rgba(210,140,120,.15);border:1.5px solid #c98a72;color:#a05c42;border-radius:8px 24px 8px 24px}
.t-aq .brow{background:rgba(120,160,210,.08);border-radius:22px 8px 22px 8px}
.t-aq .bico{background:rgba(201,138,114,.18);border-radius:50% 12% 50% 12%}
.t-aq .pill{background:#c98a72;color:#fff}
.t-aq .mockcard{background:rgba(120,160,210,.07);border-radius:28px 10px 28px 10px}
.t-aq .mockword{font-family:Georgia,serif;color:#4a6fa5}
.t-aq .qbtn{background:rgba(120,160,210,.1);border:1.5px solid rgba(74,111,165,.35);color:#33383f;border-radius:20px 6px 20px 6px}
/* ===== 19 · Blueprint ===== */
.t-bp{background:#0d2b45;color:#cfe3f5}
.t-bp .lt{color:#fff;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.t-bp .sub{color:#6f9cc0}
.t-bp .stat{background:rgba(255,255,255,.05);border:1px dashed #5b8fc0;border-radius:0}
.t-bp .stat .n{color:#fff;font-family:ui-monospace,monospace}
.t-bp .stat .l{color:#6f9cc0}
.t-bp .cta{background:#ff8c42;color:#0d2b45;border-radius:0;text-transform:uppercase;letter-spacing:.08em}
.t-bp .cta2{background:transparent;border:1px dashed #5b8fc0;color:#cfe3f5;border-radius:0}
.t-bp .brow{background:rgba(255,255,255,.05);border:1px solid #3a6a94;border-radius:0}
.t-bp .bico{background:rgba(255,140,66,.12);border:1px dashed #ff8c42;border-radius:0}
.t-bp .pill{background:#ff8c42;color:#0d2b45;border-radius:0}
.t-bp .mockcard{background:rgba(255,255,255,.05);border:1px dashed #5b8fc0;border-radius:0}
.t-bp .mockword{color:#fff;font-family:ui-monospace,monospace}
.t-bp .qbtn{background:rgba(255,255,255,.05);border:1px solid #3a6a94;color:#cfe3f5;border-radius:0}
/* ===== 20 · Sunset ===== */
.t-sun{background:linear-gradient(180deg,#3d1d5c 0%,#a63c63 40%,#e8734a 75%,#f5a623 100%);color:#fff}
.t-sun .lt{color:#ffe9c9;text-shadow:0 2px 12px rgba(0,0,0,.3)}
.t-sun .sub{color:#ffd9b0}
.t-sun .stat{background:rgba(255,255,255,.14);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25)}
.t-sun .stat .n{color:#fff}
.t-sun .stat .l{color:#ffe0bd}
.t-sun .cta{background:#fff;color:#c2410c;box-shadow:0 10px 28px rgba(0,0,0,.25)}
.t-sun .cta2{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.35);color:#ffe9c9}
.t-sun .brow{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2)}
.t-sun .bico{background:rgba(255,233,201,.25)}
.t-sun .pill{background:#ffe9c9;color:#c2410c}
.t-sun .mockcard{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25)}
.t-sun .mockword{color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.t-sun .qbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff}
/* ===== 21 · High Contrast ===== */
.t-hc{background:#000;color:#fff}
.t-hc .lt{color:#ffd400}
.t-hc .sub{color:#bbb}
.t-hc .stat{background:#111;border:2px solid #ffd400}
.t-hc .stat .n{color:#ffd400}
.t-hc .stat .l{color:#bbb}
.t-hc .cta{background:#ffd400;color:#000;border:2px solid #fff;text-transform:uppercase;font-weight:900}
.t-hc .cta2{background:#000;border:2px solid #fff;color:#fff}
.t-hc .brow{background:#111;border:2px solid #444}
.t-hc .bico{background:#1a1a1a;border:2px solid #ffd400}
.t-hc .pill{background:#ffd400;color:#000}
.t-hc .mockcard{background:#111;border:2px solid #fff}
.t-hc .mockword{color:#fff}
.t-hc .qbtn{background:#111;border:2px solid #fff;color:#fff}
/* ===== 22 · Kupfer & Stahl ===== */
.t-cu{background:linear-gradient(160deg,#1c1f24 0%,#23272e 100%);color:#e8eaee}
.t-cu .lt{background:linear-gradient(90deg,#e8a87c,#d4884a);-webkit-background-clip:text;background-clip:text;color:transparent}
.t-cu .sub{color:#8a919c}
.t-cu .stat{background:linear-gradient(160deg,#2a2f36,#22262c);border:1px solid #3a4048}
.t-cu .stat .n{background:linear-gradient(180deg,#f0c090,#c87f45);-webkit-background-clip:text;background-clip:text;color:transparent}
.t-cu .stat .l{color:#8a919c}
.t-cu .cta{background:linear-gradient(135deg,#d4884a,#a8642e);box-shadow:0 8px 26px rgba(212,136,74,.35)}
.t-cu .cta2{background:linear-gradient(160deg,#3a4048,#2c3138);border:1px solid #4a525c;color:#c8cdd5}
.t-cu .brow{background:linear-gradient(160deg,#262b31,#1f2329);border:1px solid #3a4048}
.t-cu .bico{background:linear-gradient(160deg,#3a2e24,#241d16)}
.t-cu .pill{background:rgba(212,136,74,.18);color:#e8a87c}
.t-cu .mockcard{background:linear-gradient(160deg,#262b31,#1f2329);border:1px solid #3a4048}
.t-cu .mockword{background:linear-gradient(180deg,#f0c090,#c87f45);-webkit-background-clip:text;background-clip:text;color:transparent}
.t-cu .qbtn{background:#262b31;border:1px solid #3a4048;color:#e0e4ea}
/* ===== 23 · Zen Bambus ===== */
.t-zen{background:#f6f4ec;color:#2f3d2f}
.t-zen .lt{font-family:Georgia,serif;color:#3f5c3f;font-weight:700;letter-spacing:.08em}
.t-zen .sub{color:#8fa08a}
.t-zen .stat{background:#fff;border:1px solid #d9e0d0;border-radius:4px}
.t-zen .stat .n{color:#3f5c3f;font-family:Georgia,serif}
.t-zen .stat .l{color:#8fa08a}
.t-zen .cta{background:#3f5c3f;border-radius:4px;letter-spacing:.06em}
.t-zen .cta2{background:#fff;border:1px solid #b9c7ae;color:#3f5c3f;border-radius:4px}
.t-zen .brow{background:#fff;border:1px solid #d9e0d0;border-radius:4px;border-left:4px solid #7a9c6e}
.t-zen .bico{background:#eef2e8;border-radius:4px}
.t-zen .pill{background:#eef2e8;color:#3f5c3f;border:1px solid #b9c7ae}
.t-zen .mockcard{background:#fff;border:1px solid #d9e0d0;border-radius:6px}
.t-zen .mockword{font-family:Georgia,serif;color:#3f5c3f}
.t-zen .qbtn{background:#fff;border:1px solid #c9d4bc;color:#2f3d2f;border-radius:4px}
/* ===== 24 · Traubenlimo ===== */
.t-grape{background:linear-gradient(180deg,#3b1464 0%,#5b1e86 100%);color:#fff}
.t-grape .lt{color:#f0abfc;text-shadow:0 0 16px rgba(240,171,252,.5)}
.t-grape .sub{color:#c9a3e3}
.t-grape .stat{background:rgba(255,255,255,.1);border:1px solid rgba(240,171,252,.3);border-radius:24px}
.t-grape .stat .n{color:#f0abfc}
.t-grape .stat .l{color:#c9a3e3}
.t-grape .cta{background:linear-gradient(135deg,#e879f9,#a21caf);border-radius:999px;box-shadow:0 10px 28px rgba(232,121,249,.4)}
.t-grape .cta2{background:rgba(255,255,255,.08);border:1.5px solid rgba(240,171,252,.4);color:#f0abfc;border-radius:999px}
.t-grape .brow{background:rgba(255,255,255,.08);border:1px solid rgba(240,171,252,.25);border-radius:24px}
.t-grape .bico{background:rgba(240,171,252,.15);border-radius:50%}
.t-grape .pill{background:#f0abfc;color:#4a0e6e}

<script>
function svgLogo(c1,c2){return '<svg width="40" height="40" viewBox="0 0 48 48" fill="none"><defs><linearGradient id="g'+c1.slice(1)+c2.slice(1)+'" x1="0" y1="0" x2="48" y2="48"><stop offset="0" stop-color="'+c1+'"/><stop offset="1" stop-color="'+c2+'"/></linearGradient></defs><path d="M24 3l17 6v12c0 11-7.4 19.6-17 24C14.4 40.6 7 32 7 21V9l17-6z" fill="url(#g'+c1.slice(1)+c2.slice(1)+')" opacity=".92"/><path d="M16 24l6 6 11-13" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';}
function svgBolt(c){return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" fill="'+c+'"/></svg>';}

function svgScroll(c){return '<svg width="26" height="34" viewBox="0 0 30 38" fill="none"><rect x="5" y="4" width="20" height="30" rx="2" fill="'+c+'" opacity=".25"/><rect x="5" y="4" width="20" height="30" rx="2" stroke="'+c+'" stroke-width="1.6"/><circle cx="5" cy="4" r="3" fill="'+c+'"/><circle cx="25" cy="34" r="3" fill="'+c+'"/><path d="M10 12h10M10 17h10M10 22h7" stroke="'+c+'" stroke-width="1.8" stroke-linecap="round"/></svg>';}

function decoSun(c){return '<svg width="160" height="160" viewBox="0 0 160 160"><circle cx="80" cy="80" r="34" fill="'+c+'"/><g stroke="'+c+'" stroke-width="4" stroke-linecap="round">'+Array.from({length:12},(_,i)=>{var a=i*Math.PI/6;return '<line x1="'+(80+Math.cos(a)*48)+'" y1="'+(80+Math.sin(a)*48)+'" x2="'+(80+Math.cos(a)*62)+'" y2="'+(80+Math.sin(a)*62)+'"/>';}).join('')+'</g></svg>';}
function decoGrid(c){var l='';for(var i=0;i<=10;i++){l+='<line x1="'+(i*20)+'" y1="0" x2="'+(i*20)+'" y2="200" stroke="'+c+'" stroke-width="1"/><line x1="0" y1="'+(i*20)+'" x2="200" y2="'+(i*20)+'" stroke="'+c+'" stroke-width="1"/>';}return '<svg width="200" height="200">'+l+'</svg>';}

function decoPalm(c){return '<svg width="140" height="140" viewBox="0 0 140 140" fill="none"><path d="M100 140c0-40 4-60 10-75" stroke="'+c+'" stroke-width="6" stroke-linecap="round"/><path d="M110 65c-20-8-35-4-48 8M110 65c-8-18-2-34 8-46M110 65c16-10 32-8 44 2M110 65c14 6 22 16 26 30" stroke="'+c+'" stroke-width="5" stroke-linecap="round"/></svg>';}
function decoTiles(c){var t='';for(var y=0;y<5;y++)for(var x=0;x<5;x++){t+='<rect x="'+(x*30+2)+'" y="'+(y*30+2)+'" width="26" height="26" rx="3" fill="'+c+'" opacity="'+(0.25+((x+y)%3)*0.2)+'"/>';}return '<svg width="160" height="160">'+t+'</svg>';}

 {id:'t-des',name:'25 · Wüste',c1:'#c2410c',c2:'#b45309',deco:'<div class="deco" style="top:-20px;right:-20px;opacity:.2">'+decoSun('#e8a33d')+'</div>'},
 {id:'t-deep',name:'26 · Tiefsee',c1:'#5eead4',c2:'#14b8a6',deco:'<div class="deco" style="top:20px;right:-25px;opacity:.18">'+decoBubbles('#5eead4')+'</div>'},
 {id:'t-note',name:'27 · Karo-Heft',c1:'#2b3a55',c2:'#e11d48',deco:'<div class="deco" style="top:0;left:0;opacity:.12">'+decoGrid('#c9d2e0')+'</div>'},
];

themes.forEach(function(th,i){
  var b=document.createElement('button'); b.className='themetab'+(i===0?' on':''); b.textContent=th.name;
  b.onclick=function(){
    Array.prototype.forEach.call(document.querySelectorAll('.themetab'),function(x){x.classList.remove('on');});
